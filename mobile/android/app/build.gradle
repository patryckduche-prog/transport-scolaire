plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

android {
    namespace "fr.busscolaireconnect.mobile"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "fr.busscolaireconnect.mobile"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 4032
        versionName "1.0.34"
    }

    signingConfigs {
        release {
            storeFile file("bus-scolaire-connect-test.jks")
            storePassword "BusScolaireConnect2026!"
            keyAlias "bus_scolaire_connect"
            keyPassword "BusScolaireConnect2026!"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
