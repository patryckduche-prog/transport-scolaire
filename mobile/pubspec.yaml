name: bus_scolaire_connect
description: Application mobile de suivi des transports scolaires.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  connectivity_plus: ^6.0.5
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.3
  excel: ^4.0.6
  signature: ^5.5.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/seasons/
