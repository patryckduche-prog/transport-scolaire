services:
  - type: web
    name: bus-scolaire-connect-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: FCM_SERVICE_ACCOUNT_PATH
        value: ./config/firebase-service-account.json
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
